[project]
name = "nt-classify"
version = "0.0.0"
description = "Region classifier for new-titles acquisitions. Tags each record with one of six regions of interest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # Wire up when implementation begins post-launch.
  # "scikit-learn>=1.5",
  # "pandas>=2.2",
  # "joblib>=1.4",
]

[project.scripts]
nt-classify = "nt_classify.cli:main"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nt_classify"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
